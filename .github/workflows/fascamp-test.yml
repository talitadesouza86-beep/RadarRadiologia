name: Teste Coletor FASCAMP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Executar coletor
        run: |
          python -c "from collectors.fascamp import collect; from radar import load_settings; import json; from pathlib import Path; s=load_settings(); x=collect(s); Path('data/fascamp_candidates.json').write_text(json.dumps({'total_found':len(x),'opportunities':x},ensure_ascii=False,indent=2),encoding='utf-8'); print('Total de candidatas:',len(x))"
      - name: Salvar resultado
        uses: actions/upload-artifact@v4
        with:
          name: resultado-fascamp
          path: data/fascamp_candidates.json
          if-no-files-found: error
